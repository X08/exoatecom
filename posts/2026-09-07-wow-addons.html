<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X08_WoW_3.3.5a</title>
<style>
  body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #222;
    margin: 0;
    padding: 20px;
    max-width: 800px;
  }

  h1 {
    margin-top: 0;
  }

  h3 {
    margin-bottom: 12px;
    color: #666;
    font-weight: normal;
  }

  a { color: #222; }
  a:hover { color: #666; }

  .meta {
    font-size: 14px;
    color: #666;
    margin-bottom: 24px;
  }
  .meta a { text-decoration: underline; }

  #readme-content h1 { font-size: 1.5em; margin-top: 1.6em; }
  #readme-content h2 { font-size: 1.25em; margin-top: 1.4em; color: #222; }
  #readme-content h3 { font-size: 1.1em; margin-top: 1.2em; color: #222; font-weight: bold; }

  #readme-content code {
    background: #f2f2f2;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
  }

  #readme-content pre {
    background: #f2f2f2;
    border-radius: 4px;
    padding: 14px;
    overflow-x: auto;
  }
  #readme-content pre code {
    background: none;
    padding: 0;
  }

  #readme-content img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    margin: 16px 0;
  }

  #readme-content table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.95em;
  }
  #readme-content th, #readme-content td {
    border: 1px solid #ddd;
    padding: 6px 10px;
    text-align: left;
  }

  #readme-content blockquote {
    margin: 0;
    padding-left: 14px;
    border-left: 3px solid #ddd;
    color: #666;
  }

  #readme-content ul, #readme-content ol {
    padding-left: 1.3em;
  }

  .state-msg { color: #666; }
  .state-msg.error { color: #a33; }
</style>
</head>
<body>

  <h1>X08_WoW_3.3.5a</h1>
  <h3>Addon documentation, pulled live from GitHub</h3>

  <div class="meta">
    <a href="https://github.com/X08/X08_WoW_3.3.5a" target="_blank" rel="noopener">View repository on GitHub</a>
    &nbsp;·&nbsp;
    <span id="sync-tag">syncing…</span>
  </div>

  <div id="readme-content">
    <p class="state-msg">Loading README from GitHub…</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script>
    const REPO = 'X08/X08_WoW_3.3.5a';
    const BRANCHES = ['main', 'master'];
    const contentEl = document.getElementById('readme-content');
    const syncTag = document.getElementById('sync-tag');

    async function loadReadme() {
      for (const branch of BRANCHES) {
        try {
          const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${branch}/README.md`, { cache: 'no-cache' });
          if (!res.ok) continue;
          const md = await res.text();
          contentEl.innerHTML = marked.parse(md);
          syncTag.textContent = 'live from ' + branch;
          return;
        } catch (e) {
          // try next branch
        }
      }
      contentEl.innerHTML = '<p class="state-msg error">Could not load the README right now. ' +
        '<a href="https://github.com/' + REPO + '" target="_blank" rel="noopener">View it directly on GitHub</a>.</p>';
      syncTag.textContent = 'sync failed';
    }

    loadReadme();
  </script>

</body>
</html>
