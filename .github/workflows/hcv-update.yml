name: HC Vault update
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hcv-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch vault + Wowhead item data
        run: node hcv/scripts/update.mjs
      - name: Commit changes
        run: |
          git config user.name "hcv-bot"
          git config user.email "hcv-bot@users.noreply.github.com"
          git add hcv/data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "hcv: update data" && git push; fi
