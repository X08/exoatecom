name: HC Vault update
# GitHub's cron is unreliable, so this job keeps itself alive instead of depending on it:
# it polls every 5 minutes for ~50 minutes, then starts its own next run. The hourly cron
# is only a safety net in case the chain ever breaks. (Free for public repos; a private
# repo would use up its monthly Actions minutes.)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hcv-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Poll vault, save changes
        run: |
          git config user.name "hcv-bot"
          git config user.email "hcv-bot@users.noreply.github.com"
          end=$((SECONDS + 3000))
          while true; do
            node hcv/scripts/update.mjs || echo "update failed, will retry"
            git add hcv/data
            if ! git diff --cached --quiet; then
              git commit -q -m "hcv: update data"
              git pull --rebase -q || true
              git push -q || echo "push failed, will retry next round"
            fi
            [ "$SECONDS" -ge "$end" ] && break
            sleep 300
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hcv-update.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}"
